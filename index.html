<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Ultra Rapido</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
</head><body class="bg-[#f6f7fb]"><div id="root"></div>
<script type="module">
import {createElement as h,useState,useEffect,useRef} from 'https://esm.sh/react@18.3.1';
import {createRoot} from 'https://esm.sh/react-dom@18.3.1/client';
const firebaseConfig={apiKey:"AIzaSyArMr4mFHcQH1sSTaJfg7wfyayeYVRA_ic",authDomain:"painel-injetoras.firebaseapp.com",databaseURL:"https://painel-injetoras-default-rtdb.firebaseio.com",projectId:"painel-injetoras",storageBucket:"painel-injetoras.firebasestorage.app",messagingSenderId:"332778152216",appId:"1:332778152216:web:d16a458b22bf3c9eaffe6d"};
firebase.initializeApp(firebaseConfig); const db=firebase.database(); const storage=firebase.storage();
function App(){
  const [injetoras,setInjetoras]=useState([]); const [filter,setFilter]=useState('TODAS'); const [modal,setModal]=useState(null);
  const [reason,setReason]=useState('Manutenção'); const [detail,setDetail]=useState(''); const [file,setFile]=useState(null);
  const [preview,setPreview]=useState(null); const [uploading,setUploading]=useState(false); const [toast,setToast]=useState(null);
  const fileRef=useRef();
  useEffect(()=>{ const ref=db.ref('injetoras'); ref.on('value',snap=>{ const v=snap.val(); if(v) setInjetoras(Object.values(v)); }); return ()=>ref.off(); },[]);
  function showToast(m){ setToast(m); setTimeout(()=>setToast(null),4000); }
  async function compress(f){
    try{
      const bmp=await createImageBitmap(f);
      const c=document.createElement('canvas'); c.width=640; c.height=(bmp.height/bmp.width)*640;
      c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
      return await new Promise(r=>c.toBlob(b=>r(b),'image/webp',0.6));
    }catch(e){ return f; }
  }
  async function confirmar(){
    if(!file){ showToast('Foto obrigatoria'); return; }
    setUploading(true);
    try{
      const blob=await compress(file);
      let url=null; let isCloud=false;
      try{
        const p='paradas/'+modal.id+'/'+Date.now()+'.webp';
        const ref=storage.ref(p);
        const race = Promise.race([
          ref.put(blob).then(s=>s.ref.getDownloadURL()),
          new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),8000))
        ]);
        url=await race; isCloud=true;
      }catch(e){
        url=await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(blob); });
        isCloud=false;
        setTimeout(async()=>{
          try{
            const snap=await storage.ref('paradas/'+modal.id+'/'+Date.now()+'_bg.webp').put(blob);
            const bgUrl=await snap.ref.getDownloadURL();
            await db.ref('injetoras/'+modal.id+'/lastStopPhoto').set(bgUrl);
            await db.ref('injetoras/'+modal.id+'/isCloud').set(true);
          }catch(_e){}
        },2000);
      }
      const upd={...modal,status:'PARADA',stoppedAt:Date.now(),lastStopPhoto:url,lastStopReason:reason,lastStopDetail:detail,isCloud};
      await db.ref('injetoras/'+modal.id).set(upd);
      showToast(isCloud?'✅ Na nuvem! Aparece em outro celular':'✅ Salvo rápido! Sincroniza sozinho');
      setModal(null); setFile(null); setPreview(null);
    }catch(e){ showToast('Erro: '+e.message); } finally{ setUploading(false); }
  }
  const filtered=injetoras.filter(i=> filter==='TODAS'?true:i.status===filter);
  return h('div',{className:'max-w-[1280px] mx-auto p-4'},
    h('div',{className:'bg-amber-50 border border-amber-200 rounded-xl p-3 mb-4 text-[11px] text-amber-800'},'⚡ OTIMIZADO: foto 640px + timeout 8s + fallback local - não trava mais em Manaus'),
    h('div',{className:'bg-white rounded-[20px] border p-5 mb-4 flex justify-between'},h('div',null,h('h1',{className:'font-bold'},'Painel Injetoras - ULTRA RAPIDO'),h('p',{className:'text-[12px] text-slate-500'},filtered.length+' injetoras')),h('div',{className:'flex gap-2'},['TODAS','EM_OPERACAO','PARADA'].map(f=>h('button',{key:f,onClick:()=>setFilter(f),className:'px-3 py-1.5 rounded-full text-[12px] border '+(filter===f?'bg-slate-900 text-white':'bg-white')},f)))),
    h('div',{className:'grid grid-cols-2 lg:grid-cols-4 gap-3'},
      filtered.map(inj=> h('div',{key:inj.id,className:'bg-white rounded-[18px] border p-4 flex flex-col gap-2'},
        h('div',{className:'flex justify-between'},h('div',{className:'font-mono font-bold text-[13px]'},inj.id),h('span',{className:'text-[10px] px-2 py-1 rounded-full border '+(inj.status==='EM_OPERACAO'?'bg-emerald-50 text-emerald-700':'bg-amber-50 text-amber-700')},inj.status)),
        inj.lastStopPhoto && h('img',{src:inj.lastStopPhoto,className:'h-[130px] w-full object-cover rounded-xl'}),
        h('button',{onClick:()=> inj.status==='EM_OPERACAO'?setModal(inj):db.ref('injetoras/'+inj.id).update({status:'EM_OPERACAO'}),className:'w-full py-2.5 rounded-xl text-[13px] font-bold text-white '+(inj.status==='EM_OPERACAO'?'bg-amber-500':'bg-emerald-500')},inj.status==='EM_OPERACAO'?'■ Parar':'▶ Iniciar')
      ))
    ),
    modal && h('div',{className:'fixed inset-0 bg-black/50 z-50 grid place-items-center p-4'},
      h('div',{className:'bg-white rounded-[20px] w-full max-w-[360px] p-5'},
        h('h2',{className:'font-bold mb-3'},'Parar '+modal.id),
        h('div',{className:'grid grid-cols-2 gap-2 mb-3'},['Manutenção','Falta de material','Problema técnico','Limpeza','Fim de turno','Outro'].map(r=>h('button',{key:r,onClick:()=>setReason(r),className:'text-[11px] p-2 rounded-lg border '+(reason===r?'bg-slate-900 text-white':'bg-white')},r))),
        h('textarea',{value:detail,onInput:e=>setDetail(e.target.value),placeholder:'Detalhe',className:'w-full border rounded-xl p-2 text-[12px] mb-3'}),
        h('div',{className:'border-2 border-dashed rounded-xl p-3 mb-3'},
          preview ? h('div',null,h('img',{src:preview,className:'w-full h-[150px] object-cover rounded-lg'}),h('button',{onClick:()=>{setPreview(null);setFile(null)},className:'text-[11px] text-red-500 mt-1'},'Remover')) :
          h('div',{className:'text-center'},h('button',{onClick:()=>fileRef.current.click(),className:'px-4 py-2 bg-slate-900 text-white rounded-lg text-[12px]'},'📸 Foto'),h('input',{ref:fileRef,type:'file',accept:'image/*',capture:'environment',className:'hidden',onChange:e=>{const f=e.target.files[0]; if(f){setFile(f); setPreview(URL.createObjectURL(f))}}}))
        ),
        h('div',{className:'flex gap-2'},h('button',{onClick:()=>setModal(null),className:'flex-1 py-3 border rounded-xl text-[13px]'},'Cancelar'),h('button',{onClick:confirmar,disabled:uploading||!file,className:'flex-1 py-3 rounded-xl text-[13px] font-bold text-white '+(uploading||!file?'bg-gray-300':'bg-red-600')},uploading?'Salvando rápido...':'Confirmar'))
      )
    ),
    toast && h('div',{className:'fixed bottom-4 left-4 right-4 md:w-[380px] md:left-auto p-3 rounded-xl text-[13px] z-50 bg-slate-900 text-white'},toast)
  )
}
createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
