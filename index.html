<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Injetoras 2.0 - Final</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>*{font-family:Inter, sans-serif}</style>
</head>
<body class="bg-[#f8fafc] min-h-screen">
<div id="root"></div>
<script type="module">
import { createElement as h, useState, useEffect, useRef } from 'https://esm.sh/react@18.3.1';
import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';

// ================= CONFIG FIREBASE - PREENCHA AQUI =================
const firebaseConfig = {
  apiKey: "SUA_API_KEY_AQUI",
  authDomain: "SEU_PROJETO.firebaseapp.com",
  databaseURL: "https://SEU_PROJETO-default-rtdb.firebaseio.com",
  projectId: "SEU_PROJETO",
  storageBucket: "SEU_PROJETO.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456:web:abc"
};
// ==================================================================

let db, storage, isFirebaseConfigured = false;
try {
  if(firebaseConfig.apiKey !== "SUA_API_KEY_AQUI"){
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    storage = firebase.storage();
    isFirebaseConfigured = true;
  }
} catch(e){ console.warn("Firebase não configurado", e); }

function App(){
  const [injetoras, setInjetoras] = useState(()=>{
    const saved = localStorage.getItem('injetoras_v2');
    if(saved) return JSON.parse(saved);
    return Array.from({length:8}, (_,i)=>({
      id: `INJ-${String(i+1).padStart(2,'0')}`,
      name: `Injetora ${String(i+1).padStart(2,'0')}`,
      status: Math.random()>0.5?'EM_OPERACAO':'PARADA',
      operator: ['Roberto Alves','Ana Silva','Carlos Mendes'][i%3],
      stoppedAt: Date.now() - Math.random()*3600000*5,
      lastStopPhoto: null,
      lastStopReason: null,
      lastStopAt: null
    }));
  });
  const [filter, setFilter] = useState('TODAS');
  const [showStopModal, setShowStopModal] = useState(null);
  const [reason, setReason] = useState('Manutenção');
  const [detail, setDetail] = useState('');
  const [photoFile, setPhotoFile] = useState(null);
  const [photoPreview, setPhotoPreview] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [toast, setToast] = useState(null);
  const fileInputRef = useRef();

  // Sync com Firebase
  useEffect(()=>{
    if(!isFirebaseConfigured) return;
    const ref = db.ref('injetoras');
    const onVal = ref.on('value', snap=>{
      const val = snap.val();
      if(val){
        setInjetoras(Object.values(val));
      }
    });
    return ()=> ref.off('value', onVal);
  },[]);

  useEffect(()=>{
    if(!isFirebaseConfigured) localStorage.setItem('injetoras_v2', JSON.stringify(injetoras));
  },[injetoras]);

  function showToast(msg, type='success'){
    setToast({msg, type});
    setTimeout(()=>setToast(null), 3000);
  }

  async function compressImage(file){
    return new Promise(async (resolve)=>{
      const bitmap = await createImageBitmap(file);
      const canvas = document.createElement('canvas');
      const maxW = 800;
      canvas.width = maxW;
      canvas.height = (bitmap.height / bitmap.width) * maxW;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(b=>resolve(b), 'image/webp', 0.7);
    });
  }

  function handleFile(e){
    const file = e.target.files[0];
    if(!file) return;
    setPhotoFile(file);
    setPhotoPreview(URL.createObjectURL(file));
  }

  async function confirmarParada(){
    if(!photoFile){
      showToast('Foto obrigatória','error');
      return;
    }
    if(!showStopModal) return;
    setUploading(true);
    try{
      let finalPhotoUrl = photoPreview;
      let isCloud = false;

      if(isFirebaseConfigured){
        try{
          const compressed = await compressImage(photoFile);
          const path = `paradas/${showStopModal.id}/${Date.now()}.webp`;
          const ref = storage.ref(path);
          const snap = await ref.put(compressed);
          finalPhotoUrl = await snap.ref.getDownloadURL();
          isCloud = true;
        }catch(err){
          console.error(err);
          showToast('Falha no Storage, verifique Rules. Salvando local','error');
          finalPhotoUrl = await new Promise(res=>{
            const r = new FileReader();
            r.onload = ()=>res(r.result);
            r.readAsDataURL(photoFile);
          });
        }
      } else {
        finalPhotoUrl = await new Promise(res=>{
          const r = new FileReader();
          r.onload = ()=>res(r.result);
          r.readAsDataURL(photoFile);
        });
      }

      const updated = {
        ...showStopModal,
        status: 'PARADA',
        stoppedAt: Date.now(),
        lastStopPhoto: finalPhotoUrl,
        lastStopReason: reason,
        lastStopDetail: detail,
        lastStopAt: Date.now(),
        isCloud
      };

      if(isFirebaseConfigured){
        await db.ref(`injetoras/${showStopModal.id}`).set(updated);
        await db.ref('logs').push({
          injetoraId: showStopModal.id,
          tipo: 'STOP',
          motivo: reason,
          detalhe: detail,
          fotoUrl: finalPhotoUrl,
          timestamp: firebase.database.ServerValue.TIMESTAMP
        });
      } else {
        setInjetoras(prev=>prev.map(i=>i.id===showStopModal.id?updated:i));
      }

      showToast(isCloud?'Foto salva no banco e visível em outros dispositivos!':'Foto salva local (configure Firebase para multi-device)');
      setShowStopModal(null);
      setPhotoFile(null);
      setPhotoPreview(null);
      setDetail('');
    }catch(e){
      console.error(e);
      showToast('Erro ao salvar: '+e.message,'error');
    }finally{
      setUploading(false);
    }
  }

  async function iniciarInjetora(inj){
    const updated = {...inj, status:'EM_OPERACAO', startedAt: Date.now()};
    if(isFirebaseConfigured){
      await db.ref(`injetoras/${inj.id}`).update({status:'EM_OPERACAO', startedAt: Date.now()});
    } else {
      setInjetoras(prev=>prev.map(i=>i.id===inj.id?updated:i));
    }
  }

  const filtered = injetoras.filter(i=>{
    if(filter==='TODAS') return true;
    return i.status===filter;
  });

  return h('div', {className:'max-w-[1280px] mx-auto p-4 md:p-6'},
    !isFirebaseConfigured && h('div', {className:'bg-amber-50 border border-amber-200 rounded-[14px] p-4 mb-6 flex gap-3'},
      h('div', {className:'text-[13px] text-amber-800 leading-relaxed'},
        h('b', null, '⚠️ Modo Local - foto NÃO aparece em outro dispositivo.'),
        h('br', null),
        'Para salvar no banco e ver em outro celular, preencha seu firebaseConfig no código. O campo lastStopPhoto precisa ser https://firebasestorage... não data:image. Veja instruções no código.'
      )
    ),
    h('div', {className:'bg-white rounded-[20px] shadow-sm border border-slate-200 p-6 mb-6 flex flex-wrap justify-between items-center gap-4'},
      h('div', null,
        h('h1', {className:'text-[22px] font-bold tracking-tight'}, 'Injetoras 2.0'),
        h('p', {className:'text-[13px] text-slate-500'}, `${injetoras.filter(i=>i.status==='EM_OPERACAO').length} em operação • ${injetoras.filter(i=>i.status==='PARADA').length} paradas`)
      ),
      h('div', {className:'flex gap-2'},
        ['TODAS','EM_OPERACAO','PARADA'].map(f=>
          h('button', {
            key:f,
            onClick:()=>setFilter(f),
            className:`px-3.5 py-2 rounded-full text-[13px] font-medium border ${filter===f?'bg-slate-900 text-white border-slate-900':'bg-white text-slate-600 border-slate-200'}`
          }, f==='EM_OPERACAO'?'EM OPERAÇÃO':f)
        )
      )
    ),
    h('div', {className:'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4'},
      filtered.map(inj=>{
        const tempoParada = inj.status==='PARADA'? Math.floor((Date.now() - (inj.stoppedAt||Date.now()))/60000) : 0;
        return h('div', {key:inj.id, className:`bg-white rounded-[20px] border p-5 shadow-[0_1px_2px_rgba(0,0,0,0.04)] flex flex-col gap-3 ${inj.status==='EM_OPERACAO'?'border-emerald-100':'border-amber-100'}`},
          h('div', {className:'flex justify-between items-start'},
            h('div', null,
              h('div', {className:'font-mono font-bold text-[15px]'}, inj.id),
              h('div', {className:'text-[13px] text-slate-500'}, inj.name)
            ),
            h('span', {className:`text-[10px] px-2 py-1 rounded-full font-bold tracking-wide ${inj.status==='EM_OPERACAO'?'bg-emerald-50 text-emerald-700 border border-emerald-200':'bg-amber-50 text-amber-700 border border-amber-200'}`}, inj.status)
          ),
          inj.lastStopPhoto && h('div', {className:'relative rounded-[14px] overflow-hidden h-[180px] bg-slate-100'},
            h('img', {src:inj.lastStopPhoto, className:'w-full h-full object-cover', alt:'foto parada'}),
            h('div', {className:'absolute inset-0 bg-gradient-to-t from-black/70 to-transparent'}),
            h('div', {className:'absolute bottom-2 left-2 right-2 flex justify-between items-end'},
              h('div', {className:'text-[11px] text-white'},
                h('div', {className:'font-semibold'}, inj.lastStopReason||'Parada'),
                inj.lastStopDetail && h('div', {className:'opacity-80 truncate max-w-[140px]'}, inj.lastStopDetail)
              ),
              h('span', {className:`text-[10px] px-1.5 py-0.5 rounded-full ${inj.isCloud?'bg-emerald-500 text-white':'bg-white/80 text-slate-700'}`}, inj.isCloud?'☁️ Banco':'📱 Local')
            )
          ),
          h('div', {className:'text-[12px] text-slate-500'},
            inj.status==='PARADA'?`Parada há ${tempoParada}min • ${inj.operator}`:`Operando • ${inj.operator}`
          ),
          h('div', {className:'flex gap-2 mt-2'},
            inj.status==='EM_OPERACAO'?
              h('button', {onClick:()=>setShowStopModal(inj), className:'flex-1 bg-amber-500 hover:bg-amber-600 text-white text-[13px] font-semibold py-2.5 rounded-[12px]'}, '■ Parar')
              :
              h('button', {onClick:()=>iniciarInjetora(inj), className:'flex-1 bg-emerald-500 hover:bg-emerald-600 text-white text-[13px] font-semibold py-2.5 rounded-[12px]'}, '▶ Iniciar')
          )
        )
      })
    ),
    showStopModal && h('div', {className:'fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4'},
      h('div', {className:'bg-white rounded-[20px] w-full max-w-[420px] p-6 shadow-2xl animate-[slideUp_0.3s_ease]'},
        h('h2', {className:'text-[18px] font-bold mb-1'}, `Parar ${showStopModal.id}`),
        h('p', {className:'text-[13px] text-slate-500 mb-4'}, 'Foto obrigatória - será salva no Firebase Storage e visível em outro dispositivo'),
        h('div', {className:'space-y-4'},
          h('div', {className:'grid grid-cols-2 gap-2'},
            ['Manutenção','Falta de material','Problema técnico','Limpeza','Fim de turno','Outro'].map(r=>
              h('button', {
                key:r,
                onClick:()=>setReason(r),
                className:`text-[13px] px-3 py-2 rounded-[10px] border text-left ${reason===r?'bg-slate-900 text-white border-slate-900':'bg-white border-slate-200'}`
              }, r)
            )
          ),
          h('textarea', {
            placeholder:'Detalhe do motivo (opcional)',
            value:detail,
            onInput:e=>setDetail(e.target.value),
            className:'w-full border border-slate-200 rounded-[12px] p-3 text-[13px] min-h-[70px] resize-none'
          }),
          h('div', {className:'border-2 border-dashed border-slate-200 rounded-[14px] p-4'},
            photoPreview?
              h('div', {className:'space-y-3'},
                h('img', {src:photoPreview, className:'w-full h-[200px] object-cover rounded-[10px]'}),
                h('button', {onClick:()=>{setPhotoPreview(null); setPhotoFile(null);}, className:'text-[12px] text-red-500'}, 'Remover foto')
              )
              :
              h('div', {className:'text-center'},
                h('div', {className:'text-[13px] text-slate-500 mb-3'}, '📸 Foto obrigatória'),
                h('div', {className:'flex gap-2 justify-center'},
                  h('button', {onClick:()=>fileInputRef.current.click(), className:'px-4 py-2 bg-slate-900 text-white rounded-[10px] text-[13px] font-medium'}, 'Tirar Foto'),
                  h('button', {onClick:()=>fileInputRef.current.click(), className:'px-4 py-2 bg-white border border-slate-200 rounded-[10px] text-[13px]'}, 'Galeria')
                ),
                h('input', {ref:fileInputRef, type:'file', accept:'image/*', capture:'environment', className:'hidden', onChange:handleFile})
              )
          ),
          h('div', {className:'flex gap-2'},
            h('button', {onClick:()=>{setShowStopModal(null); setPhotoPreview(null); setPhotoFile(null);}, className:'flex-1 py-3 rounded-[12px] border border-slate-200 text-[13px] font-medium'}, 'Cancelar'),
            h('button', {
              onClick:confirmarParada,
              disabled:uploading || !photoFile,
              className:`flex-1 py-3 rounded-[12px] text-[13px] font-semibold text-white ${uploading||!photoFile?'bg-gray-200 text-gray-400 cursor-not-allowed':'bg-red-600 hover:bg-red-700'}`
            }, uploading?'Enviando para o banco...':'📸 Confirmar Parada com Foto')
          )
        )
      )
    ),
    toast && h('div', {className:`fixed bottom-5 left-5 right-5 md:left-auto md:w-[380px] p-4 rounded-[14px] shadow-2xl z-[70] text-[13px] font-medium ${toast.type==='error'?'bg-red-600 text-white':'bg-slate-900 text-white'}`}, toast.msg)
  )
}

createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
